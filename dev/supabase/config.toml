# Isolated developer Auth/database. Never link this project to hosted production.
project_id = "openvegas-restoration"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17
health_timeout = "3m"

[db.migrations]
enabled = false
schema_paths = []

[db.seed]
enabled = false
sql_paths = []

[realtime]
enabled = false

[studio]
enabled = false

[inbucket]
enabled = true
port = 54324

[storage]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:8000"
additional_redirect_urls = ["http://127.0.0.1:8000/ui", "http://127.0.0.1:8000/ui/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
minimum_password_length = 8

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
max_frequency = "1s"

[auth.rate_limit]
email_sent = 100
sign_in_sign_ups = 100

[edge_runtime]
enabled = false

[analytics]
enabled = false

version = 1
title = "OpenVegas: Sprites, Emotes, Model Switching And Marketing"
max_workers = 3
objective = '''Build purchasable pixel companions and completion emotes, a searchable Emotes storefront, safe integrations with supported external coding terminals, easy backend-funded model switching, and art-led marketing exports. Reuse the existing OpenVegas code and brand. Show real visual prototypes for approval before expanding the art catalog. This document is the implementation assignment, not a claim that these features already exist.'''

[[workstreams]]
id = "recon"
owner = "Coordinator with Workers A, B and C (read-only first pass)"
objective = "Revalidate the baseline and expose integration limits before implementation."
paths = ["Existing terminal/avatar, store/payment, gateway/model, website, packaging and creative paths listed below; read-only initially."]
deliverables = ["Revision and dirty-state baseline; current executable/package path; actual runtime and dependency versions.", "Evidence-backed gap map with no credentials; installed external CLI hook/capability matrix.", "User-visible prototype plan, paid-service access/rights questions, and locked ownership for shared files."]
checks = ["Confirm which existing features work rather than inferring from file names or HTTP 200.", "Record available test services and separate local, staging and production resources."]

[[workstreams]]
id = "contracts"
owner = "Coordinator"
depends_on = ["recon"]
objective = "Agree on the small shared contracts before workers edit in parallel."
paths = ["Proposed openvegas/emotes/ manifest/event interfaces; API schemas; Supabase migrations; shared CLI entry points; dependency/package manifests."]
deliverables = ["Versioned asset manifest, runtime event contract, entitlement state machine and capability catalog interfaces.", "Explicit decisions on renderer compatibility, purchase currency, offline licenses, feature flags and rollout."]
checks = ["No shared-file collisions or secret-bearing hook payloads; schema fixtures available to all workers.", "Data migrations are additive and production application remains a separate approval gate."]

[[workstreams]]
id = "art"
owner = "Worker A: visual assets and animation engine"
depends_on = ["contracts"]
objective = "Create and show original sprite and completion-animation prototypes."
paths = ["scripts/generate_dealer_sheet.py (reference only); proposed asset import/preview scripts; proposed emote source packs; ui/assets/avatar-* compatibility adapters."]
deliverables = ["Three original character concepts with contact sheets, native-size terminal previews and short dancing loops.", "Three 4-7 second original sports emote storyboards and at least one polished runnable preview before catalog expansion.", "Artist submission kit, validated PNG/JSON pack, provenance and editable source assets; user approval recorded."]
checks = ["SPR-ART-01: original artwork and native-terminal previews receive explicit user approval; the old procedural generator is not the quality baseline.", "SPR-DANCE-02: authored pose-changing dance frames pass contact-sheet, repeated-loop and real-terminal review; moving or scaling one static sprite does not pass.", "Stable silhouettes, fixed anchor, pixel-grid alignment, alpha correctness and smooth loop seam on light/dark backgrounds.", "No athlete/team/logo asset published for sale without documented clearance; no generator watermark removal.", "A fresh valid designer pack imports and previews without changes to runtime code."]

[[workstreams]]
id = "runtime"
owner = "Worker A after the art gate; Coordinator integrates shared CLI changes"
depends_on = ["art"]
objective = "Ship the emote command and safe terminal lifecycle integrations."
paths = ["Proposed openvegas/emotes/ runtime, import, renderers and adapters; openvegas/tui/sprite_render.py; assigned CLI integration patch; tests/test_tui/ and new emote tests."]
deliverables = ["One-line openvegas emote entry point, owned-pack picker, previews, selection and diagnostics.", "Waiting and completion state integration within OpenVegas; tested adapters for external CLI versions.", "Opt-in setup/uninstall with config backup and non-destructive merge; documented fallback when a terminal cannot support overlays."]
checks = ["SPR-LIFE-03: busy animation follows real turn lifecycle, celebrates exactly once per successful logical turn and stops on cancellation/failure.", "SPR-TERM-04: a single render owner preserves input, cursor, selection, scrollback and streamed output; no overlapping animation loops.", "No duplicate completion events; errors, cancellation, retries and individual tool finishes never masquerade as whole-task success.", "User can type, select, resize and scroll without snap-to-bottom, erased content or focus loss.", "Non-TTY/NO_COLOR/reduced-motion behavior, offline entitlement behavior, event bounds and cleanup pass."]

[[workstreams]]
id = "commerce"
owner = "Worker B: storefront, payments and entitlements; Coordinator owns migrations"

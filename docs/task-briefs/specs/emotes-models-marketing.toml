checks = ["Insufficient funds, concurrent clicks, idempotent replay, canceled checkout, pending payment, refund/revocation and cross-user access pass.", "One confirmed purchase means exactly one wallet debit and entitlement; checkout redirect alone cannot grant anything.", "Live Stripe credentials and production customer balances are never used by the test suite."]


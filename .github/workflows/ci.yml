name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c requirements.lock -e ".[server,dev]"
          pip check

      - name: Contract boundary checks
        run: |
          python scripts/ci/check_callback_replay_boundary.py
          python scripts/ci/check_tool_request_immutability.py

      - name: Run tests
        env:
          OPENVEGAS_TEST_MODE: "1"
          OPENVEGAS_RUNTIME_ENV: test
          OPENVEGAS_DOTENV_OVERRIDE: "0"
          OPENVEGAS_ENABLE_TOUCHID: "0"
          PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring
        run: |
          pytest -q

      - name: Safe offline checks
        run: python scripts/check_local.py fast

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local_ci_only
          POSTGRES_DB: ov_test_ci
        ports:
          - 55439:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ov_test_ci"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      OPENVEGAS_INTEGRATION_DATABASE_URL: postgresql://postgres:local_ci_only@127.0.0.1:55439/ov_test_ci
      OPENVEGAS_RUNTIME_ENV: test
      OPENVEGAS_TEST_MODE: "1"
      OPENVEGAS_DOTENV_OVERRIDE: "0"
      PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -c requirements.lock -e ".[server,dev]"
      - name: Auth role scaffold for SQL tests (not Supabase Auth)
        run: psql "$OPENVEGAS_INTEGRATION_DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN;'
      - name: Real disposable database tests
        run: pytest -q tests/integration

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t openvegas-ci .
      - name: Offline image checks (not startup proof)
        run: |
          docker run --rm --network none --read-only --entrypoint python openvegas-ci -m pip check
          docker run --rm --network none --read-only --entrypoint python openvegas-ci -c "import os,pathlib,server.main; assert os.geteuid()!=0; assert pathlib.Path('/app/ui/index.html').is_file(); assert not pathlib.Path('/app/.env').exists()"

name: emote installed-package gate (not frozen release)

on:
  workflow_dispatch:
  push:
    branches:
      - 'codex/emotes-release-verification-*'

permissions:
  contents: read

jobs:
  installed-package:
    name: Installed wheel / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install existing build and test requirements
        run: python -m pip install "setuptools>=77.0.3" wheel "pytest>=8.0"
      - name: Build wheel without publishing
        run: python -m pip wheel --no-deps --no-build-isolation --wheel-dir dist .
      - name: Install wheel and declared runtime dependencies (never editable)
        shell: bash
        run: python -m pip install dist/openvegas-*.whl
      - name: Verify installed package offline, outside source and with empty home
        # No continue-on-error: native Windows installed loading must really pass.
        run: python scripts/verify_emote_release.py --json emote-package-report.json
      - name: Secure resource boundary and native Windows regression tests
        if: always()
        env:
          # Developer Mode or symlink privilege is mandatory in this security gate.
          # Local runs may skip privilege-dependent symlinks, never this CI lane.
          EMOTE_REQUIRE_WINDOWS_SYMLINKS: "1"
        run: >-
          python -B -m pytest -q -ra --confcutdir=tests/test_emotes
          tests/test_emotes/test_manifest.py
          tests/test_emotes/test_manifest_resources.py
          tests/test_emotes/test_windows_resources.py
          tests/test_emotes/test_windows_state.py
          tests/test_emotes/test_spool_platform.py
          --junitxml=emote-resource-tests.xml
      - name: Native Windows private state and event transport (installed wheel, offline)
        if: always() && runner.os == 'Windows'
        run: >-
          python -I -B tests/test_emotes/windows_state_native.py
          --junitxml=${{ github.workspace }}/emote-windows-state-tests.xml
      - name: Packaging failure-injection regression tests
        if: always()
        run: python -B -m pytest -q --confcutdir=tests/test_packaging tests/test_packaging
      - name: Preserve package evidence, not a release artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emote-package-${{ matrix.os }}
          path: |
            emote-package-report.json
            emote-resource-tests.xml
            emote-windows-state-tests.xml
          if-no-files-found: warn

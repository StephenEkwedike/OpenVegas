name: Frozen emote candidates (never publish)

on:
  workflow_dispatch:
  push:
    branches: ['codex/emotes-release-verification-*']

permissions:
  contents: read

jobs:
  frozen:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Linux audio runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2
      - name: Install candidate build dependencies
        run: python -m pip install -c requirements.lock ".[audio]" "pyinstaller==6.22.3"
      - name: Build native executable and npm tarball, verify empty-home startup
        run: python scripts/build_cli_candidate.py --output dist/native-candidate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unsigned-native-candidate-${{ matrix.os }}
          retention-days: 7
          path: |
            dist/native-candidate/candidate.json
            dist/native-candidate/*.txt
            dist/native-candidate/npm/*.tgz

name: Windows repaired customer foreground (offline)
on:
  push:
    branches: ['codex/qa-repaired-win32-0319-foreground']
permissions:
  contents: read
  actions: read
jobs:
  windows-offline:
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      CI: 'true'
      PYTEST_ADDOPTS: '-q -p no:cacheprovider --tb=no --show-capture=no'
      DISABLE_TELEMETRY: '1'
      DISABLE_AUTOUPDATER: '1'
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          architecture: x64
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          architecture: x64
      - name: Check assembly run, artifact ID and ZIP digest
        run: python -IB scripts/qa_artifact_provenance.py
      - uses: actions/download-artifact@v4
        with:
          name: customer-tarballs-unpublished
          run-id: 43742060705
          github-token: ${{ github.token }}
          path: packs
      - name: Pin the actual customer files and install the exact pair offline
        run: |
          python -IB scripts/qa_customer_image.py packs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm.cmd install --offline --ignore-scripts --no-fund --no-audit --no-package-lock --cache ./empty-cache --prefix ./installed ./packs/openvegas-ai-0.3.19.tgz ./packs/lordesteph-openvegas-win32-x64-0.3.19.tgz
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Install focused test dependencies
        run: >-
          python -m pip --isolated install --only-binary=:all: --no-cache-dir
          -c requirements.lock pytest pytest-asyncio httpx websockets uvicorn Pillow click rich
      - name: Install official packages without lifecycle scripts
        run: |
          $platform = node -p 'process.platform + "/" + process.arch'
          if ($platform -ne 'win32/x64') { throw 'Windows x64 required' }
          $prefix = Join-Path $env:RUNNER_TEMP 'native-hosts'
          npm.cmd install --prefix $prefix --registry=https://registry.npmjs.org/ --include=optional --ignore-scripts --no-fund --no-audit --no-package-lock --save-exact '@openai/codex@0.166.0' '@anthropic-ai/claude-code@2.1.322'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $modules = Join-Path $prefix 'node_modules'
          foreach ($spec in @(
            @{ id = 'CODEX'; wrapper = '@openai/codex'; version = '0.166.0'; leaf = '@openai/codex-win32-x64/vendor/x86_64-pc-windows-msvc/bin/codex.exe' }
            @{ id = 'CLAUDE'; wrapper = '@anthropic-ai/claude-code'; version = '2.1.322'; leaf = '@anthropic-ai/claude-code-win32-x64/claude.exe' }
          )) {
            $wrapper = Join-Path $modules $spec.wrapper
            $meta = Get-Content -Raw -LiteralPath (Join-Path $wrapper 'package.json') | ConvertFrom-Json
            if ($meta.name -ne $spec.wrapper -or $meta.version -ne $spec.version) { throw 'Unexpected wrapper' }
            $paths = @(@($modules, (Join-Path $wrapper 'node_modules')) |
              ForEach-Object { Join-Path $_ $spec.leaf } |
              Where-Object { Test-Path -LiteralPath $_ -PathType Leaf })
            if ($paths.Count -ne 1) { throw "Expected one installed $($spec.id) x64 executable" }
            $exe = (Get-Item -LiteralPath $paths[0]).FullName
            "OV_WINDOWS_$($spec.id)_EXE=$exe" >> $env:GITHUB_ENV
          }
      - name: Install pinned ConPTY driver and test-only dependencies
        run: |
          if ((git rev-parse HEAD) -ne $env:GITHUB_SHA) { throw 'Unexpected candidate revision' }
          $pin = Join-Path $env:RUNNER_TEMP 'openvegas-conpty-pin.txt'
          'pywinpty==2.0.15 --hash=sha256:9a6bcec2df2707aaa9d08b86071970ee32c5026e10bcc3cc5f6f391d85baf7ca' | Set-Content -LiteralPath $pin -Encoding ascii
          'pyte==0.8.2 --hash=sha256:85db42a35798a5aafa96ac4d8da78b090b2c933248819157fc0e6f78876a0135' | Add-Content -LiteralPath $pin -Encoding ascii
          python -m pip --isolated install --no-deps --only-binary=:all: --require-hashes -r $pin
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pip --isolated install --only-binary=:all: -c requirements.lock keyring python-dotenv prompt-toolkit 'setuptools>=77.0.3' wheel
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $bash = Join-Path $env:ProgramFiles 'Git/bin/bash.exe'
          if (!(Test-Path -LiteralPath $bash -PathType Leaf)) { throw 'Expected runner Git Bash' }
          "OV_WINDOWS_BASH_EXE=$bash" >> $env:GITHUB_ENV
      - name: Verify installed customer PE, JS and both native SHA-256 pins
        run: |
          python -IB scripts/qa_customer_image.py installed
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "OV_QA_NODE=$((Get-Command node.exe).Source)" >> $env:GITHUB_ENV
      - name: Block outbound traffic from native hosts, helpers and Python
        id: isolation
        run: |
          Set-NetFirewallProfile -Profile Domain,Private,Public -Enabled True -ErrorAction Stop
          $profiles = @(Get-NetFirewallProfile)
          if (!$profiles.Count -or ($profiles | Where-Object { $_.Enabled -ne 'True' })) {
            throw 'Windows Firewall must be enabled for every profile'
          }
          $hosts = @($env:OV_WINDOWS_CODEX_EXE, $env:OV_WINDOWS_CLAUDE_EXE)
          $helpers = @(Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP 'native-hosts') -Filter '*.exe' -File -Recurse -ErrorAction Stop | ForEach-Object FullName)
          $git = Join-Path $env:ProgramFiles 'Git'
          $tools = @((Get-Command python.exe).Source, (Get-Command node.exe).Source, $env:OV_WINDOWS_BASH_EXE,
            (Join-Path $git 'usr/bin/bash.exe'), (Join-Path $git 'usr/bin/sh.exe'), (Join-Path $git 'cmd/git.exe'))
          $programs = @(($hosts + $helpers + $tools + @($env:OV_QA_PE)) | Sort-Object -Unique)
          $n = 0
          foreach ($exe in $programs) {
            if (!$exe -or ![IO.Path]::IsPathFullyQualified($exe) -or !(Test-Path -LiteralPath $exe -PathType Leaf)) {
              throw 'A required native test image is missing'
            }
            $n++
            $id = if ($exe -in $hosts) { "OpenVegas-QA-$([IO.Path]::GetFileName($exe))" } else { "OpenVegas-QA-helper-$n" }
            New-NetFirewallRule -Name $id -DisplayName $id -Profile Any -Enabled True -Direction Outbound -Action Block -Program $exe -ErrorAction Stop | Out-Null
            $active = Get-NetFirewallRule -PolicyStore ActiveStore -Name $id -ErrorAction Stop
            $app = $active | Get-NetFirewallApplicationFilter
            $addr = $active | Get-NetFirewallAddressFilter
            if ($active.Enabled -ne 'True' -or $active.Action -ne 'Block' -or $active.Direction -ne 'Outbound' -or
                $active.Profile -ne 'Any' -or $app.Program -ine $exe -or (@($addr.RemoteAddress) -join ',') -ne 'Any') {
              throw 'Effective executable-specific outbound block missing'
            }
          }
      - name: Real installed customer in foreground ConPTY, both native hosts
        id: foreground
        env:
          OV_WINDOWS_CONPTY_ISOLATED: '1'
        run: |
          $fixture = 'tests/test_integrations/test_windows_installed_switch.py::test_installed_customer_switch'
          python -B -m pytest "--junitxml=$env:RUNNER_TEMP/customer.xml" "${fixture}[codex]" "${fixture}[claude]" *> $null
          exit $LASTEXITCODE
      - name: Report each named result without raw native or JUnit data
        if: ${{ !cancelled() && steps.isolation.outcome == 'success' && steps.foreground.outcome != 'skipped' }}
        run: python -IB scripts/qa_foreground_results.py

name: Windows native billing QA (offline)

on:
  push:
    branches: ['codex/qa-windows-native-billing-20261114']

permissions:
  contents: read

jobs:
  windows-offline:
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      CI: 'true'
      PYTEST_ADDOPTS: '-q -p no:cacheprovider --tb=short --show-capture=no'
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
      DISABLE_TELEMETRY: '1'
      DISABLE_AUTOUPDATER: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          architecture: x64
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          architecture: x64
      - name: Install focused test dependencies
        run: >-
          python -m pip --isolated install --only-binary=:all: --no-cache-dir
          -c requirements.lock pytest pytest-asyncio httpx websockets uvicorn Pillow click rich
      - name: Install official packages without lifecycle scripts
        run: |
          $platform = node -p 'process.platform + "/" + process.arch'
          if ($platform -ne 'win32/x64') { throw 'Windows x64 required' }
          $prefix = Join-Path $env:RUNNER_TEMP 'native-hosts'
          npm.cmd install --prefix $prefix --registry=https://registry.npmjs.org/ --include=optional --ignore-scripts --no-fund --no-audit --no-package-lock --save-exact '@openai/codex@0.166.0' '@anthropic-ai/claude-code@2.1.322'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $modules = Join-Path $prefix 'node_modules'
          foreach ($spec in @(
            @{ id = 'CODEX'; wrapper = '@openai/codex'; version = '0.166.0'; leaf = '@openai/codex-win32-x64/vendor/x86_64-pc-windows-msvc/bin/codex.exe' }
            @{ id = 'CLAUDE'; wrapper = '@anthropic-ai/claude-code'; version = '2.1.322'; leaf = '@anthropic-ai/claude-code-win32-x64/claude.exe' }
          )) {
            $wrapper = Join-Path $modules $spec.wrapper
            $meta = Get-Content -Raw -LiteralPath (Join-Path $wrapper 'package.json') | ConvertFrom-Json
            if ($meta.name -ne $spec.wrapper -or $meta.version -ne $spec.version) { throw 'Unexpected wrapper' }
            $paths = @(@($modules, (Join-Path $wrapper 'node_modules')) |
              ForEach-Object { Join-Path $_ $spec.leaf } |
              Where-Object { Test-Path -LiteralPath $_ -PathType Leaf })
            if ($paths.Count -ne 1) { throw "Expected one installed $($spec.id) x64 executable" }
            $exe = (Get-Item -LiteralPath $paths[0]).FullName
            "OV_WINDOWS_$($spec.id)_EXE=$exe" >> $env:GITHUB_ENV
          }
      - name: Install isolated customer candidate and pinned ConPTY driver
        run: |
          if ((git rev-parse HEAD) -ne $env:GITHUB_SHA) { throw 'Unexpected candidate revision' }
          $pin = Join-Path $env:RUNNER_TEMP 'openvegas-conpty-pin.txt'
          'pywinpty==2.0.15 --hash=sha256:9a6bcec2df2707aaa9d08b86071970ee32c5026e10bcc3cc5f6f391d85baf7ca' | Set-Content -LiteralPath $pin -Encoding ascii
          python -m pip --isolated install --no-deps --only-binary=:all: --require-hashes -r $pin
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pip --isolated install --only-binary=:all: -c requirements.lock keyring python-dotenv prompt-toolkit 'setuptools>=77.0.3' wheel
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pip --isolated install --no-deps --no-build-isolation .
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $bash = Join-Path $env:ProgramFiles 'Git/bin/bash.exe'
          if (!(Test-Path -LiteralPath $bash -PathType Leaf)) { throw 'Expected runner Git Bash' }
          "OV_WINDOWS_BASH_EXE=$bash" >> $env:GITHUB_ENV
      - name: Block outbound traffic from native hosts, helpers and Python
        id: isolation
        run: |
          Set-NetFirewallProfile -Profile Domain,Private,Public -Enabled True -ErrorAction Stop
          $profiles = @(Get-NetFirewallProfile)
          if (!$profiles.Count -or ($profiles | Where-Object { $_.Enabled -ne 'True' })) {
            throw 'Windows Firewall must be enabled for every profile'
          }
          $hosts = @($env:OV_WINDOWS_CODEX_EXE, $env:OV_WINDOWS_CLAUDE_EXE)
          $helpers = @(Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP 'native-hosts') -Filter '*.exe' -File -Recurse -ErrorAction Stop | ForEach-Object FullName)
          $git = Join-Path $env:ProgramFiles 'Git'
          $tools = @((Get-Command python.exe).Source, (Get-Command node.exe).Source, $env:OV_WINDOWS_BASH_EXE,
            (Join-Path $git 'usr/bin/bash.exe'), (Join-Path $git 'usr/bin/sh.exe'), (Join-Path $git 'cmd/git.exe'))
          $programs = @(($hosts + $helpers + $tools) | Sort-Object -Unique)
          $n = 0
          foreach ($exe in $programs) {
            if (!$exe -or ![IO.Path]::IsPathFullyQualified($exe) -or !(Test-Path -LiteralPath $exe -PathType Leaf)) {
              throw 'A required native test image is missing'
            }
            $n++
            $id = if ($exe -in $hosts) { "OpenVegas-QA-$([IO.Path]::GetFileName($exe))" } else { "OpenVegas-QA-helper-$n" }
            New-NetFirewallRule -Name $id -DisplayName $id -Profile Any -Enabled True -Direction Outbound -Action Block -Program $exe -ErrorAction Stop | Out-Null
            $active = Get-NetFirewallRule -PolicyStore ActiveStore -Name $id -ErrorAction Stop
            $app = $active | Get-NetFirewallApplicationFilter
            $addr = $active | Get-NetFirewallAddressFilter
            if ($active.Enabled -ne 'True' -or $active.Action -ne 'Block' -or $active.Direction -ne 'Outbound' -or
                $active.Profile -ne 'Any' -or $app.Program -ine $exe -or (@($addr.RemoteAddress) -join ',') -ne 'Any') {
              throw 'Effective executable-specific outbound block missing'
            }
          }
      - name: Native image, bundled catalog and peer ownership
        run: |
          python -B -m pytest "--junitxml=$env:RUNNER_TEMP/images.xml" tests/test_integrations/test_windows_native_image.py tests/test_integrations/test_inference_router_windows.py --deselect=tests/test_integrations/test_inference_router_windows.py::test_refuse_wrong_os *> $null
          exit $LASTEXITCODE
      - name: Installed customer controls in foreground ConPTY
        if: ${{ !cancelled() && steps.isolation.outcome == 'success' }}
        env:
          OV_WINDOWS_CONPTY_ISOLATED: '1'
        run: |
          python -B -m pytest "--junitxml=$env:RUNNER_TEMP/customer.xml" tests/test_integrations/test_windows_installed_switch.py tests/test_integrations/test_windows_customer.py *> $null
          exit $LASTEXITCODE
      - name: Native session lease and owner crash recovery
        if: ${{ !cancelled() && steps.isolation.outcome == 'success' }}
        run: |
          python -B -m pytest "--junitxml=$env:RUNNER_TEMP/lease.xml" tests/test_integrations/test_windows_session_lease.py *> $null
          exit $LASTEXITCODE
      - name: Terminal control, CLI and native console restoration
        id: terminal
        if: ${{ !cancelled() && steps.isolation.outcome == 'success' }}
        run: |
          python -B -m pytest "--junitxml=$env:RUNNER_TEMP/terminal.xml" tests/test_integrations/test_windows_terminal_host.py tests/test_integrations/test_inference_router_session.py::test_peer_cleanup_error_cannot_skip_wallet_revocation *> $null
          exit $LASTEXITCODE
      - name: Classify console failure without child output
        if: ${{ !cancelled() && steps.terminal.outcome == 'failure' }}
        run: |
          [xml]$xml = Get-Content -Raw -LiteralPath (Join-Path $env:RUNNER_TEMP 'terminal.xml')
          if (!$xml.SelectSingleNode('//testcase[@name="test_native_windows_console_restore"]/failure')) { exit 0 }
          @'
          import subprocess, sys
          # Diagnostic only: the original failed test and red gate remain authoritative.
          stages = {10:"attach", 11:"read-mode", 12:"enter-guard", 13:"set-mode", 14:"set-page",
                    15:"check-mutation", 16:"unwind", 17:"check-restoration", 0:"not-reproduced"}
          probe = """
          import ctypes, msvcrt, os
          from ctypes import wintypes as W
          from openvegas.integrations.windows_terminal import console_modes
          stage = 10
          try:
              for fd, name in enumerate(('CONIN$', 'CONOUT$', 'CONOUT$')):
                  source = os.open(name, os.O_RDWR)
                  if source != fd:
                      os.dup2(source, fd)
                      os.close(source)
              stage = 11
              api = ctypes.WinDLL('kernel32.dll', winmode=0x800)
              h = W.HANDLE(msvcrt.get_osfhandle(0))
              def mode():
                  value = W.DWORD()
                  assert api.GetConsoleMode(h, ctypes.byref(value))
                  return value.value
              old, cp = mode(), api.GetConsoleOutputCP()
              newcp = 437 if cp == 65001 else 65001
              stage = 12
              try:
                  with console_modes():
                      stage = 13
                      assert api.SetConsoleMode(h, old ^ 1)
                      stage = 14
                      assert api.SetConsoleOutputCP(newcp)
                      stage = 15
                      assert mode() == old ^ 1 and api.GetConsoleOutputCP() == newcp
                      stage = 16
                      raise ValueError('test unwind')
              except ValueError:
                  pass
              stage = 17
              assert mode() == old and api.GetConsoleOutputCP() == cp
          except BaseException:
              os._exit(stage)
          """
          try:
              run = subprocess.run([sys.executable, '-B', '-c', probe], creationflags=subprocess.CREATE_NEW_CONSOLE,
                                   timeout=30, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              label = stages.get(run.returncode, "child-start")
          except (OSError, subprocess.TimeoutExpired):
              label = "spawn-or-timeout"
          print("::warning::Console diagnostic stage: " + label)
          '@ | python -B -
      - name: Installed Codex app-server against synthetic loopback
        if: ${{ !cancelled() && steps.isolation.outcome == 'success' }}
        env:
          OV_WINDOWS_CODEX_PAYER_PROBE: '1'
        run: |
          $env:OV_WINDOWS_CODEX_ENTRY = $env:OV_WINDOWS_CODEX_EXE
          python -B -m pytest "--junitxml=$env:RUNNER_TEMP/codex.xml" tests/test_integrations/test_windows_codex_payer_roundtrip.py *> $null
          exit $LASTEXITCODE
      - name: Installed Claude stream against synthetic loopback
        if: ${{ !cancelled() && steps.isolation.outcome == 'success' }}
        run: |
          python -B -m pytest "--junitxml=$env:RUNNER_TEMP/claude.xml" tests/test_integrations/test_windows_claude_stream_native.py *> $null
          exit $LASTEXITCODE
      - name: Require all named native passes and reject skips
        if: ${{ !cancelled() && steps.isolation.outcome == 'success' }}
        run: |
          $matrix = foreach ($effort in 'low','high') {
            foreach ($model in 'gpt-6-astra','gpt-6.1-sol','gpt-6.1-terra') {
              "test_windows_codex_payer_roundtrip[$effort-$model]"
            }
          }
          $required = [ordered]@{
            images = @('test_launches_official_windows_image[codex-0.166.0]', 'test_launches_official_windows_image[claude-2.1.322]', 'test_native_windows_child_socket_only', 'test_session_close_denies_pending_request_and_retires_handle_after_inspection')
            lease = @('test_default_lease_directory_independent_of_launcher_env','test_second_process_refused_until_owner_exit')
            terminal = @('test_windows_terminal_cli_separates_launch_and_controls','test_native_windows_console_restore','test_windows_locator_and_profile_are_private','test_owned_child_routes_and_switches_without_restart[codex]','test_owned_child_routes_and_switches_without_restart[claude]','test_peer_cleanup_error_cannot_skip_wallet_revocation')
            codex = $matrix
            claude = @('test_pinned_claude_stream_json_round_trip')
            customer = @('test_installed_customer_switch[codex]','test_installed_customer_switch[claude]','test_bad_bank_request_cannot_issue_or_revoke')
          }
          $ok = $true
          foreach ($group in $required.Keys) {
            $report = Join-Path $env:RUNNER_TEMP "$group.xml"
            if (!(Test-Path -LiteralPath $report)) { Write-Output "::error::Missing $group JUnit report"; $ok = $false; continue }
            [xml]$xml = Get-Content -Raw -LiteralPath $report
            $cases = @($xml.SelectNodes('//testcase'))
            foreach ($case in $cases) {
              $bad = $case.SelectSingleNode('failure|error|skipped')
              if ($bad) {
                $ok = $false
                # Publish only source locations and reviewed test names, never traceback values or fixture IO.
                $locations = [regex]::Matches($bad.InnerText, '(?:tests|openvegas)[/\\][A-Za-z0-9_/\\.]+\.py:\d+') | ForEach-Object Value | Select-Object -Unique -Last 4
                $label = $case.GetAttribute('name') -replace '[^a-zA-Z0-9_.\[\]-]', '_'
                if ($group -eq 'customer') {
                  $stage = $case.SelectSingleNode("(properties/property[@name='qa_stage'])[last()]")
                  if ($stage -and $stage.value -match '^(isolation|conpty|native-start|switch-(v|host)|status-[012]|answer-[012]|shutdown)$') {
                    Write-Output "::error::$label checkpoint: $($stage.value)"
                  }
                  $sites = [regex]::Matches($bad.InnerText, '(?:scripts[/\\])?verify_windows_[a-z]+\.py:\d+') | ForEach-Object Value | Select-Object -Unique -Last 3
                  if ($sites) { Write-Output "::error::$label driver: $($sites -join ', ')" }
                  $frames = [regex]::Match($bad.InnerText, 'QA frames: ((?:[a-z_]+:\d+,?){1,12})')
                  if ($frames.Success) { Write-Output "::error::$label managed: $($frames.Groups[1].Value)" }
                  $source = $case.SelectSingleNode("properties/property[@name='qa_source']")
                  if ($source -and $source.value -match '^(?:[a-z_]+:\d{1,5},?){1,24}$') { Write-Output "::error::$label observations: $($source.value)" }
                  $screen = [regex]::Match($bad.InnerText, 'QA screen: (busy|refused|held|unconfirmed|trust|signin|command-missing|setup|api-key-dialog|plugin-trust|git-bash|claude-login)')
                  if ($screen.Success) { Write-Output "::error::$label screen: $($screen.Groups[1].Value)" }
                }
                Write-Output "::error::$group / $label / $($bad.LocalName) / $($locations -join ', ')"
              }
            }
            $passed = @($cases | Where-Object { !$_.SelectSingleNode('failure|error|skipped') } | ForEach-Object { $_.GetAttribute('name') })
            foreach ($name in $required[$group]) {
              if (@($passed | Where-Object { $_ -ceq $name }).Count -ne 1) {
                Write-Output "::error::Missing required pass: $name"
                $ok = $false
              }
            }
            "$group : $($passed.Count) of $($cases.Count) selected cases passed" >> $env:GITHUB_STEP_SUMMARY
          }
          if (!$ok) { throw 'One or more Windows QA gates did not pass' }
          "Installed Windows CLI/Python wheel and native ConPTY with synthetic financial services at $env:GITHUB_SHA. No personal subscription, real payment, npm installer or release certification." >> $env:GITHUB_STEP_SUMMARY

name: Windows managed startup without inference
on:
  push:
    branches: ['codex/qa-win32-private-root-0319']
permissions:
  contents: read
  actions: read
jobs:
  windows-offline:
    if: github.repository == 'StephenEkwedike/OpenVegas' && !github.event.repository.private
    runs-on: windows-2022
    timeout-minutes: 40
    env:
      CI: 'true'
      DISABLE_TELEMETRY: '1'
      DISABLE_AUTOUPDATER: '1'
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          architecture: x64
      - name: Read reviewed assembly identity
        id: pin
        shell: python
        run: |
          import json, os
          from pathlib import Path
          p = json.loads(Path('qa-image-pins.json').read_bytes())
          assert all(type(p[k]) is int and p[k] > 0 for k in ('run_id','artifact_id'))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              print('run='+str(p['run_id']), 'artifact='+str(p['artifact_id']), sep='\n', file=f)
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.pin.outputs.artifact }}
          run-id: ${{ steps.pin.outputs.run }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: packs
      - name: Verify and unpack reviewed customer files without installation
        run: python -IB scripts/windows_managed_startup.py unpack
      - uses: actions/checkout@v5
        with:
          ref: add579ab7211283c0b7a18173616ff4310f5d230
          path: baseline
          persist-credentials: false
      - name: Stage exact seven-file frozen overlay and build dependencies
        run: python -B -m scripts.windows_fixture_build stage
      - name: Build separate QA executable and compare embedded product code
        run: python -B -m scripts.qa_managed_build
      - name: Retain only the separately named offline QA executable
        uses: actions/upload-artifact@v4
        with:
          name: offline-windows-qa-managed-only
          retention-days: 3
          if-no-files-found: error
          path: ${{ env.OV_QA_MANAGED }}
      - name: Get standalone native publisher images and pin all three executables
        run: |
          $dir = (New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP 'native-hosts')).FullName
          $cx = Join-Path $dir 'codex.exe'
          $cc = Join-Path $dir 'claude.exe'
          curl.exe -qfsSL --retry 2 --max-time 180 -o "$cx" https://github.com/openai/codex/releases/download/rust-v0.166.0/codex-x86_64-pc-windows-msvc.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          curl.exe -qfsSL --retry 2 --max-time 180 -o "$cc" https://downloads.claude.ai/claude-code-releases/2.1.322/win32-x64/claude.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $pin = Get-Content -Raw -LiteralPath qa-image-pins.json | ConvertFrom-Json
          $pe = (Get-Item -LiteralPath 'installed/node_modules/@lordesteph/openvegas-win32-x64/bin/openvegas-win32-x64.exe').FullName
          $js = (Get-Item -LiteralPath 'installed/node_modules/openvegas-ai/bin/openvegas.js').FullName
          if ((Get-FileHash $cx).Hash -ine '9d563ee4e0441ff9d59d612013e0460ddf8e5709735c2d9f6b98b7ef8ca4eb42' -or
              (Get-FileHash $cc).Hash -ine '345996b4bdbae21d817f750fae2f34cbf8d81224a5444c78136091d121beb298' -or
              (Get-FileHash $pe).Hash -ine $pin.pe -or (Get-FileHash $js).Hash -ine $pin.launcher) {
              throw 'Unexpected Windows test image'
          }
          "OV_WINDOWS_CODEX_EXE=$cx" >> $env:GITHUB_ENV
          "OV_WINDOWS_CLAUDE_EXE=$cc" >> $env:GITHUB_ENV
          "OV_QA_NODE=$((Get-Command node.exe).Source)" >> $env:GITHUB_ENV
          "OV_QA_PE=$pe" >> $env:GITHUB_ENV
          "OV_QA_APP=$js" >> $env:GITHUB_ENV
      - name: Verify complete publisher Codex layout for rehearsal comparison
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'publisher-codex.tar.gz'
          $dir = Join-Path $env:RUNNER_TEMP 'native-hosts/publisher-codex'
          curl.exe -qfsSL --retry 2 --max-time 180 -o "$archive" https://github.com/openai/codex/releases/download/rust-v0.166.0/codex-package-x86_64-pc-windows-msvc.tar.gz
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -IB scripts/windows_codex_bundle.py "$archive" "$dir"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "OV_QA_CODEX_BUNDLE_EXE=$((Get-Item -LiteralPath (Join-Path $dir 'bin/codex.exe')).FullName)" >> $env:GITHUB_ENV
      - name: Install test-side terminal and private-directory dependencies
        run: |
          $pin = Join-Path $env:RUNNER_TEMP 'conpty-wheels.txt'
          'pywinpty==2.0.15 --hash=sha256:9a6bcec2df2707aaa9d08b86071970ee32c5026e10bcc3cc5f6f391d85baf7ca' | Set-Content -LiteralPath $pin -Encoding ascii
          'pyte==0.8.2 --hash=sha256:85db42a35798a5aafa96ac4d8da78b090b2c933248819157fc0e6f78876a0135' | Add-Content -LiteralPath $pin -Encoding ascii
          python -m pip --isolated install --no-deps --only-binary=:all: --require-hashes -r $pin
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pip --isolated install --only-binary=:all: -c requirements.lock wcwidth Pillow rich prompt-toolkit uvicorn websockets
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "OV_WINDOWS_BASH_EXE=$(Join-Path $env:ProgramFiles 'Git/bin/bash.exe')" >> $env:GITHUB_ENV
      - name: Block outbound traffic from native hosts, helpers and Python
        id: isolation
        run: |
          Set-NetFirewallProfile -Profile Domain,Private,Public -Enabled True -ErrorAction Stop
          $profiles = @(Get-NetFirewallProfile)
          if (!$profiles.Count -or ($profiles | Where-Object { $_.Enabled -ne 'True' })) {
            throw 'Windows Firewall must be enabled for every profile'
          }
          $hosts = @($env:OV_WINDOWS_CODEX_EXE, $env:OV_WINDOWS_CLAUDE_EXE)
          $helpers = @(Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP 'native-hosts') -Filter '*.exe' -File -Recurse -ErrorAction Stop | ForEach-Object FullName)
          $git = Join-Path $env:ProgramFiles 'Git'
          $tools = @((Get-Command python.exe).Source, (Get-Command node.exe).Source, $env:OV_WINDOWS_BASH_EXE,
            (Join-Path $git 'usr/bin/bash.exe'), (Join-Path $git 'usr/bin/sh.exe'), (Join-Path $git 'cmd/git.exe'))
          $programs = @(($hosts + $helpers + $tools + @($env:OV_QA_PE, $env:OV_QA_MANAGED)) | Sort-Object -Unique)
          $n = 0
          foreach ($exe in $programs) {
            if (!$exe -or ![IO.Path]::IsPathFullyQualified($exe) -or !(Test-Path -LiteralPath $exe -PathType Leaf)) {
              throw 'A required native test image is missing'
            }
            $n++
            $id = if ($exe -in $hosts) { "OpenVegas-QA-$([IO.Path]::GetFileName($exe))" } else { "OpenVegas-QA-helper-$n" }
            New-NetFirewallRule -Name $id -DisplayName $id -Profile Any -Enabled True -Direction Outbound -Action Block -Program $exe -ErrorAction Stop | Out-Null
            $active = Get-NetFirewallRule -PolicyStore ActiveStore -Name $id -ErrorAction Stop
            $app = $active | Get-NetFirewallApplicationFilter
            $addr = $active | Get-NetFirewallAddressFilter
            if ($active.Enabled -ne 'True' -or $active.Action -ne 'Block' -or $active.Direction -ne 'Outbound' -or
                $active.Profile -ne 'Any' -or $app.Program -ine $exe -or (@($addr.RemoteAddress) -join ',') -ne 'Any') {
              throw 'Effective executable-specific outbound block missing'
            }
          }
      - name: Managed stdio unnamed round trip
        env:
          OV_WINDOWS_CONPTY_ISOLATED: '1'
        run: python -B -m scripts.qa_managed_run roundtrip
      - name: Managed stdio interrupted wallet retry
        if: ${{ !cancelled() && steps.isolation.outcome == 'success' }}
        env:
          OV_WINDOWS_CONPTY_ISOLATED: '1'
        run: python -B -m scripts.qa_managed_run retry

name: Windows native billing QA (offline)

on:
  push:
    branches: ['codex/qa-windows-native-billing-20261114']

permissions:
  contents: read

jobs:
  image-and-peer:
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          architecture: x64
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          architecture: x64
      - name: Install focused test dependencies
        run: >-
          python -m pip --isolated install --only-binary=:all: --no-cache-dir
          -c requirements.lock pytest pytest-asyncio httpx websockets Pillow click rich
      - name: Install official packages without lifecycle scripts
        run: |
          $platform = node -p 'process.platform + "/" + process.arch'
          if ($platform -ne 'win32/x64') { throw 'Windows x64 required' }
          $prefix = Join-Path $env:RUNNER_TEMP 'native-hosts'
          npm.cmd install --prefix $prefix --registry=https://registry.npmjs.org/ --include=optional --ignore-scripts --no-fund --no-audit --no-package-lock --save-exact '@openai/codex@0.166.0' '@anthropic-ai/claude-code@2.1.322'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $modules = Join-Path $prefix 'node_modules'
          foreach ($spec in @(
            @{ id = 'CODEX'; wrapper = '@openai/codex'; version = '0.166.0'; leaf = '@openai/codex-win32-x64/vendor/x86_64-pc-windows-msvc/bin/codex.exe' }
            @{ id = 'CLAUDE'; wrapper = '@anthropic-ai/claude-code'; version = '2.1.322'; leaf = '@anthropic-ai/claude-code-win32-x64/claude.exe' }
          )) {
            $wrapper = Join-Path $modules $spec.wrapper
            $meta = Get-Content -Raw -LiteralPath (Join-Path $wrapper 'package.json') | ConvertFrom-Json
            if ($meta.name -ne $spec.wrapper -or $meta.version -ne $spec.version) { throw 'Unexpected wrapper' }
            $paths = @(@($modules, (Join-Path $wrapper 'node_modules')) |
              ForEach-Object { Join-Path $_ $spec.leaf } |
              Where-Object { Test-Path -LiteralPath $_ -PathType Leaf })
            if ($paths.Count -ne 1) { throw "Expected one installed $($spec.id) x64 executable" }
            $exe = (Get-Item -LiteralPath $paths[0]).FullName
            "OV_WINDOWS_$($spec.id)_EXE=$exe" >> $env:GITHUB_ENV
          }
      - name: Block all outbound traffic from both native hosts
        run: |
          Set-NetFirewallProfile -Profile Domain,Private,Public -Enabled True -ErrorAction Stop
          $profiles = @(Get-NetFirewallProfile)
          if (!$profiles.Count -or ($profiles | Where-Object { $_.Enabled -ne 'True' })) {
            throw 'Windows Firewall must be enabled for every profile'
          }
          $programs = @($env:OV_WINDOWS_CODEX_EXE, $env:OV_WINDOWS_CLAUDE_EXE)
          foreach ($exe in $programs) {
            if (!$exe -or ![IO.Path]::IsPathFullyQualified($exe) -or !(Test-Path -LiteralPath $exe -PathType Leaf)) {
              throw 'A required native test image is missing'
            }
            $id = "OpenVegas-QA-$([IO.Path]::GetFileName($exe))"
            New-NetFirewallRule -Name $id -DisplayName $id -Profile Any -Enabled True -Direction Outbound -Action Block -Program $exe -ErrorAction Stop | Out-Null
            $active = Get-NetFirewallRule -PolicyStore ActiveStore -Name $id -ErrorAction Stop
            if ($active.Enabled -ne 'True' -or $active.Action -ne 'Block') { throw 'Native egress block inactive' }
          }
      - name: Run image and peer tests (no model requests)
        env:
          CI: 'true'
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
          DISABLE_TELEMETRY: '1'
          DISABLE_AUTOUPDATER: '1'
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'windows-native.xml'
          python -m pytest -q -ra "--junitxml=$report" tests/test_integrations/test_windows_native_image.py tests/test_integrations/test_inference_router_windows.py --deselect=tests/test_integrations/test_inference_router_windows.py::test_refuse_wrong_os
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          [xml]$xml = Get-Content -Raw -LiteralPath $report
          $cases = @($xml.SelectNodes('//testcase'))
          if (!$cases.Count -or $xml.SelectNodes('//testcase/*[self::failure or self::error or self::skipped]').Count) {
            throw 'Expected every selected Windows test to pass without skips'
          }
          foreach ($name in @('test_launches_official_windows_image[codex-0.166.0]', 'test_launches_official_windows_image[claude-2.1.322]', 'test_native_windows_child_socket_only')) {
            if (@($cases | Where-Object { $_.GetAttribute('name') -ceq $name }).Count -ne 1) {
              throw "Missing required native test: $name"
            }
            "Passed: $name" >> $env:GITHUB_STEP_SUMMARY
          }
          "$($cases.Count) passed; image and peer QA only, not installed end-to-end billing." >> $env:GITHUB_STEP_SUMMARY

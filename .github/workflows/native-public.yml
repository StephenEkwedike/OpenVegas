name: Native 0.3.27 candidates (never publish)

on:
  workflow_dispatch:
  push:
    branches: ['codex/native-wallet-0327-be439116']

permissions:
  contents: read

jobs:
  frozen:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: linux-x64
          - runner: ubuntu-22.04-arm
            target: linux-arm64
          - runner: macos-15
            target: darwin-arm64
          - runner: macos-15-intel
            target: darwin-x64
          - runner: windows-2022
            target: win32-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Verify preinstalled Node runtime without a package manager
        run: node -e "if(Number(process.versions.node.split('.')[0])<20)process.exit(1)"
      - name: Linux audio runtime
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          source /etc/os-release
          [[ "$ID:$VERSION_CODENAME" == ubuntu:jammy ]]
          arch=$(dpkg --print-architecture)
          case "$arch" in
              amd64) main=https://archive.ubuntu.com/ubuntu; security=https://security.ubuntu.com/ubuntu ;;
              arm64) main=https://ports.ubuntu.com/ubuntu-ports; security=$main ;;
              *) exit 2 ;;
          esac
          work=$(mktemp -d "${RUNNER_TEMP:-/tmp}/ov-audio.XXXXXXXX")
          out="$work/bundle"
          mkdir -p "$out/source" "$out/notices" "$work/build"
          list="$work/ubuntu-src.list"
          printf 'deb-src [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] %s %s main universe\n' "$main" jammy "$main" jammy-updates "$security" jammy-security > "$list"
          sudo install -m 0644 "$list" /etc/apt/sources.list.d/openvegas-audio-src.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libportaudio2 libasound2-dev dpkg-dev build-essential pkg-config
          cd "$out/source"
          for package in libportaudio2 libasound2; do
              spec=$(dpkg-query -W -f='${source:Package}=${source:Version}' "$package:$arch")
              case "$spec" in portaudio19=19.6.0-*|alsa-lib=1.2.6.1-*) ;; *) echo "Unreviewed Jammy source: $spec" >&2; exit 1;; esac
              apt-get source --download-only --only-source "$spec"
          done
          shopt -s nullglob
          pa=(portaudio19_*.dsc); alsa=(alsa-lib_*.dsc)
          [[ ${#pa[@]} == 1 && ${#alsa[@]} == 1 ]]
          # dpkg-source verifies component digests against the .dsc; apt verified the
          # .dsc and tarballs against Ubuntu's signed source index.
          dpkg-source -x "${pa[0]}" "$work/build/portaudio"
          dpkg-source -x "${alsa[0]}" "$work/build/alsa-source"
          cd "$work/build/portaudio"
          ./configure --prefix=/usr --libdir=/usr/lib --enable-shared --disable-static --with-alsa --without-jack --without-oss
          make -j2
          make DESTDIR="$work/install" install
          cp -L "$work/install/usr/lib/libportaudio.so.2" "$out/libportaudio.so.2"
          if nm -D --defined-only "$out/libportaudio.so.2" | grep " PaJack_" > /dev/null; then exit 1; fi
          nm -D --defined-only "$out/libportaudio.so.2" | grep " PaAlsa_" > /dev/null

          multi=$(dpkg-architecture -qDEB_HOST_MULTIARCH)
          cp -L "/usr/lib/$multi/libasound.so.2" "$out/libasound.so.2"
          # Ship the exact distribution sources (including its packaging), versions,
          # applied build commands, and full notices inside the ELF.
          dpkg-query -W -f='${binary:Package}\t${Version}\t${source:Package}\t${source:Version}\n' \
            libportaudio2:"$arch" libasound2:"$arch" libasound2-dev:"$arch" libasound2-data > "$out/notices/packages.tsv"
          for p in libportaudio2 libasound2 libasound2-data; do
              mkdir -p "$out/notices/$p"; cp -L "/usr/share/doc/$p/copyright" "$out/notices/$p/copyright"
          done
          cp -L /usr/share/common-licenses/LGPL-2.1 "$out/notices/LGPL-2.1"
          cp -L /usr/share/common-licenses/GPL-2 "$out/notices/GPL-2"
          cp -L /usr/share/common-licenses/LGPL-2 "$out/notices/LGPL-2"
          cp -L /usr/share/common-licenses/GPL-3 "$out/notices/GPL-3"
          cp -L /usr/share/common-licenses/LGPL-3 "$out/notices/LGPL-3"
          while IFS= read -r cfg; do
              case "$cfg" in /usr/share/alsa/*.conf)
                  install -Dm0644 "$cfg" "$out/alsa/${cfg#/usr/share/alsa/}" ;;
              esac
          done < <(dpkg-query -L libasound2-data)
          test -s "$out/alsa/alsa.conf"
          # Preserve the recipe that actually ran, not an unverified URL to source.
          cp "$0" "$out/notices/build-audio.sh"
          (cd "$out"; sha256sum libportaudio.so.2 libasound.so.2 source/* > notices/SHA256SUMS)
          echo "OPENVEGAS_LINUX_AUDIO=$out" >> "$GITHUB_ENV"
      - name: Export byte-identical pinned public client
        run: |
          git -c core.autocrlf=false -c core.eol=lf archive --format=zip --output ../release-source.zip HEAD -- openvegas openvegas-0.3.27.dist-info scripts npm-cli pyproject.toml requirements.lock ci-build-requirements.txt native-release-inputs.json native-router-freeze.json .github/workflows/native-public.yml
          python -m zipfile -e ../release-source.zip dist/git-source
          python dist/git-source/scripts/ci_prepare_native_frozen.py dist/git-source dist/frozen
      - name: Install lock-constrained build dependencies
        env:
          OPENSSL_STATIC: '1'
        run: python -m pip install --no-cache-dir -c dist/frozen/cli/requirements.lock -r dist/git-source/ci-build-requirements.txt
      - name: Reject dynamically linked macOS cryptography
        if: runner.os == 'macOS'
        run: |
          python -c "import cryptography.hazmat.bindings._rust as r, subprocess; result=subprocess.check_output(['otool','-L',r.__file__],text=True); print(result); assert not any(name in result for name in ('libssl.', 'libcrypto.'))"
      - name: Build and independently verify frozen binary and Mac profile
        working-directory: dist/frozen/cli
        env:
          FREEZE_PIN: 'abe8507cd4fc7d3ad3e654503429db91f9656f87c10075559c5f3f71c88f2729'
          SOURCE_PIN: 'be4391160a6d126814ef919b09062f6a6d91e08dc95e599560762bd30ecd483a'
          TARGET: ${{ matrix.target }}
        run: python -B ../../git-source/scripts/ci_runtime_binary.py --output "${{ github.workspace }}/dist/native-candidate"
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-native-candidate-${{ matrix.target }}
          retention-days: 7
          path: |
            dist/native-candidate/candidate.json
            dist/native-candidate/independent-verified.json
            dist/native-candidate/bin/openvegas-${{ matrix.target }}*
      - uses: actions/upload-artifact@v4
        with:
          name: frozen-source-evidence-${{ matrix.target }}
          retention-days: 7
          path: |
            dist/frozen/freeze.json
            dist/frozen/public-export-receipt.json

  assembly-check:
    needs: frozen
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: unsigned-native-candidate-*
          path: dist/candidates
      - name: Assemble all five platforms without publication
        run: >-
          python scripts/ci_runtime_assemble.py
          --candidate dist/candidates/unsigned-native-candidate-darwin-arm64
          --candidate dist/candidates/unsigned-native-candidate-darwin-x64
          --candidate dist/candidates/unsigned-native-candidate-linux-arm64
          --candidate dist/candidates/unsigned-native-candidate-linux-x64
          --candidate dist/candidates/unsigned-native-candidate-win32-x64
          --output dist/npm-assembly-check
      - name: Pack exact customer tarballs without package manager
        run: python -IB scripts/ci_runtime_tarballs.py pack
      - uses: actions/upload-artifact@v4
        with:
          name: customer-tarballs-unpublished
          retention-days: 7
          path: dist/customer-tarballs

  customer-install:
    needs: assembly-check
    name: Installed native plans / ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-22.04, target: linux-x64}
          - {runner: ubuntu-22.04-arm, target: linux-arm64}
          - {runner: macos-15, target: darwin-arm64}
          - {runner: macos-15-intel, target: darwin-x64}
          - {runner: windows-2022, target: win32-x64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 12
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci_runtime_tarballs.py
          sparse-checkout-cone-mode: false
      - name: Verify preinstalled Node runtime without a package manager
        run: node -e "if(Number(process.versions.node.split('.')[0])<20)process.exit(1)"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: customer-tarballs-unpublished
          path: packs
      - name: Verify archive checksums and materialize the exact pair in a clean directory
        run: python -IB scripts/ci_runtime_tarballs.py unpack
      - name: Exercise the tarball launcher and verify the installed bundle
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p 'process.platform+"-"+process.arch')" = "$TARGET"
          node installed/node_modules/openvegas-ai/bin/openvegas.js --version | grep '0\.3\.27'
          node installed/node_modules/openvegas-ai/bin/openvegas.js --verify-bundle >/dev/null
      - name: Linux system libraries survive a managed shell launch
        if: runner.os == 'Linux'
        shell: bash
        working-directory: installed
        run: |
          set -eu
          export OV_EXPECT_LIBRARY="$RUNNER_TEMP/openvegas-linker-probe"
          LD_LIBRARY_PATH="$OV_EXPECT_LIBRARY" node node_modules/openvegas-ai/bin/openvegas.js --_terminal-relay -- /bin/sh -c 'test "$LD_LIBRARY_PATH" = "$OV_EXPECT_LIBRARY" && node --version'
          env -u LD_LIBRARY_PATH -u LD_LIBRARY_PATH_ORIG node node_modules/openvegas-ai/bin/openvegas.js --_terminal-relay -- /bin/sh -c 'test -z "${LD_LIBRARY_PATH-}" && node --version'
      - name: Fetch pinned standalone publisher executables without registry access
        run: python -IB scripts/ci_runtime_tarballs.py hosts
      - name: Verify both executable versions and both installed native plans
        shell: python
        run: |
          import hashlib, json, os, pathlib, re, shutil, subprocess, tempfile
          P = pathlib.Path
          target = os.environ['TARGET']
          triple = {'linux-x64':'x86_64-unknown-linux-musl','linux-arm64':'aarch64-unknown-linux-musl',
                    'darwin-arm64':'aarch64-apple-darwin','darwin-x64':'x86_64-apple-darwin','win32-x64':'x86_64-pc-windows-msvc'}[target]
          node = P(shutil.which('node')).resolve(strict=True)
          suffix = '.exe' if os.name == 'nt' else ''
          assert target == subprocess.check_output([str(node),'-p','process.platform+"-"+process.arch'],text=True).strip()
          root = P.cwd()
          m = root/'installed/node_modules'
          customer = m/'openvegas-ai'
          js = customer/'bin/openvegas.js'
          def sha(p):
              with p.open('rb') as f: return hashlib.file_digest(f,'sha256').hexdigest()
          exes = {host:root/'hosts'/(host+suffix) for host in ('codex','claude')}
          host_pins = {'linux-x64': {'codex': 'b452ca20f838a8855a88a41050ee4a694033fff4ea3ecdad5633e6e0e8d13f2b', 'claude': 'bfb3703ad5380242328459bc62ada4bde8ae7ba57c6e1eeadb9c00e08874c478'}, 'linux-arm64': {'codex': '3bb41c9a80187773e2a59278d4fc355b1a163c31bb5a79581e37d4fe428af047', 'claude': 'f220ca50ea4f3222043ff83cc224a1262e0196e9897acc0871efa94235b0c1fd'}, 'win32-x64': {'codex': 'ce1945eb440b5481ed1233ebaf32b7056ee7e4e452fa62ffe1cbfb26103cdee0', 'claude': '345996b4bdbae21d817f750fae2f34cbf8d81224a5444c78136091d121beb298'}, 'darwin-x64': {'codex': 'e57da7be8695c079d2d1d156dab79708e43ebb6cf7e34527b8b01d6aa942788e', 'claude': 'b513d15117cbf1bb05095dab41963fd394ff40de1fa99dcc6d7d1033bf292e9b'}, 'darwin-arm64': {'codex': '739cda86e15d30a6e2b40cf8dcbbfb988aaf48b305b27065573bb8e9fd41d002', 'claude': 'a9d237949db816a0b7afd88a9a8e1df36b3a597a30f5a41d1c0539eb180a3450'}}[target]
          assert {k:sha(p) for k,p in exes.items()}==host_pins
          index = json.loads((customer/'release.json').read_bytes())
          assert index['source_sha256']=='be4391160a6d126814ef919b09062f6a6d91e08dc95e599560762bd30ecd483a' and index['version']=='0.3.27'
          p = index['platforms'][target]
          assert p['package']=='@lordesteph/openvegas-'+target and p['binary']=='openvegas-'+target+suffix
          assert sha(m/p['package']/'bin'/p['binary'])==p['sha256']
          assert sha(js)=='437a0ca08f9a4459c716b1fba541b6a450e659d54f4aca5aa3dee9c9f66f6d40'
          print('Verified same-run installed binary:',target,p['sha256'],flush=True)
          with tempfile.TemporaryDirectory() as scratch:
              home=P(scratch).resolve(); work=home/'work'; work.mkdir()
              env={k:os.environ[k] for k in ('PATH','SYSTEMROOT','WINDIR','PATHEXT','COMSPEC','SYSTEMDRIVE','PROGRAMDATA','ProgramFiles','ProgramFiles(x86)','ProgramW6432','ALLUSERSPROFILE','CommonProgramFiles','CommonProgramFiles(x86)') if k in os.environ}
              env.update(HOME=str(home),USERPROFILE=str(home),TMP=str(home),TEMP=str(home),TMPDIR=str(home),CI='true',
                         OPENVEGAS_LOAD_PROJECT_ENV='0',OPENVEGAS_BACKEND_URL='http://127.0.0.1:1',
                         DISABLE_TELEMETRY='1',DISABLE_AUTOUPDATER='1',DISABLE_ERROR_REPORTING='1',CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC='1')
              for k,d in [('CODEX_HOME','.codex'),('CLAUDE_CONFIG_DIR','.claude'),('XDG_CONFIG_HOME','config'),('APPDATA','Roaming'),('LOCALAPPDATA','Local')]:
                  v=home/d; v.mkdir(); env[k]=str(v)
              if os.name=='nt':
                  env.update(HOMEDRIVE=home.drive,HOMEPATH=str(home)[len(home.drive):])
                  bash=P(env['ProgramFiles'])/'Git/bin/bash.exe'
                  assert bash.is_file()
                  env['CLAUDE_CODE_GIT_BASH_PATH']=str(bash)
              env['PATH']=os.pathsep.join([*(str(p.parent.resolve(strict=True)) for p in exes.values()),env['PATH']])
              def run(label,argv):
                  q=subprocess.run(argv,env=env,cwd=work,stdin=subprocess.DEVNULL,capture_output=True,encoding='utf-8',errors='replace',timeout=180)
                  if q.returncode:
                      reason=next((x for x in ('plugin command failed','was not found','No host settings were changed','Local integration setup failed') if x in q.stdout+q.stderr),'no fixed diagnostic')
                      raise SystemExit(f'{label}: exit {q.returncode}: {reason}')
                  return q.stdout
              for host,version in [('codex','0.169.0'),('claude','2.1.322')]:
                  exe=exes[host].resolve(strict=True)
                  assert P(shutil.which(host,path=env['PATH'])).samefile(exe)
                  assert sha(exe)==host_pins[host], 'native executable digest mismatch'
                  out=run(host+' version',[str(exe),'--version'])
                  assert re.search(r'(?<![\d.])'+re.escape(version)+r'(?![\d.])',out)
                  print(host,version,'verified native executable',sha(exe),flush=True)
              rows=run('installed native plans',[str(node),str(js),'--local','go','--host','both','--dry-run']).splitlines()
              for row in ('codex 0.169.0: mcp_text_only','claude 2.1.322: mod_and_mcp'):
                  assert rows.count(row)==1, 'Missing expected native plan: '+row
                  print('Verified installed plan:',row,flush=True)
          receipt = dict(target=target, sha=os.environ['GITHUB_SHA'], run_id=os.environ['GITHUB_RUN_ID'],
                         attempt=os.environ['GITHUB_RUN_ATTEMPT'], source_sha256=index['source_sha256'],
                         tarballs={n:sha(root/'packs'/n) for n in ['openvegas-ai-0.3.27.tgz','lordesteph-openvegas-'+target+'-0.3.27.tgz']},
                         binary_sha256=p['sha256'], launcher_sha256=sha(js), hosts=host_pins,
                         npm_install_verified=False, clean_tarball_layout=True, plans={'codex':'mcp_text_only','claude':'mod_and_mcp'}, foreground=False, model_turns=0)
          (root/'installed-qa.json').write_text(json.dumps(receipt,sort_keys=True)+'\n')
      - uses: actions/upload-artifact@v4
        with:
          name: installed-qa-${{ matrix.target }}
          path: installed-qa.json
          if-no-files-found: error
          retention-days: 7

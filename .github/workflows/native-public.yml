name: Native 0.3.19 candidates (never publish)

on:
  workflow_dispatch:
  push:
    branches: ['codex/native-release-0319']

permissions:
  contents: read

jobs:
  frozen:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: linux-x64
          - runner: ubuntu-22.04-arm
            target: linux-arm64
          - runner: macos-15
            target: darwin-arm64
          - runner: macos-15-intel
            target: darwin-x64
          - runner: windows-2022
            target: win32-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Linux audio runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2
      - name: Export byte-identical pinned public client
        run: |
          git -c core.autocrlf=false -c core.eol=lf archive --format=zip --output ../release-source.zip HEAD
          python -m zipfile -e ../release-source.zip dist/git-source
          python dist/git-source/scripts/ci_prepare_native_frozen.py dist/git-source dist/frozen
      - name: Install lock-constrained build dependencies
        env:
          OPENSSL_STATIC: '1'
        run: python -m pip install --no-cache-dir -c dist/frozen/cli/requirements.lock -r dist/git-source/ci-build-requirements.txt
      - name: Reject dynamically linked macOS cryptography
        if: runner.os == 'macOS'
        run: |
          python -c "import cryptography.hazmat.bindings._rust as r, subprocess; result=subprocess.check_output(['otool','-L',r.__file__],text=True); print(result); assert not any(name in result for name in ('libssl.', 'libcrypto.'))"
      - name: Build and clean-install private platform package
        working-directory: dist/frozen/cli
        run: python -B scripts/build_cli_candidate.py --output ../../native-candidate
      - name: Verify target and exact compiled source
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
        run: |
          python -c "import json,os; r=json.load(open('dist/native-candidate/candidate.json')); assert r['version']=='0.3.19' and r['os']+'-'+r['arch']==os.environ['EXPECTED_TARGET']; assert r['source_sha256']=='211f1621ec2c5910bd166f0c9a1699c216c659391f4ba97fd7cea5e3a8201c90'"
          python -B dist/git-source/scripts/verify_native_router_candidate.py verify --frozen dist/frozen --freeze-sha256 416b1e5ae2f4cf890ca019f7e825e5116652bc9b9375fde891b273282aa76d95 --candidate dist/native-candidate --output dist/native-candidate/independent-verified.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unsigned-native-candidate-${{ matrix.target }}
          retention-days: 7
          path: |
            dist/native-candidate/candidate.json
            dist/native-candidate/independent-verified.json
            dist/native-candidate/bin/*
            dist/native-candidate/*.txt
            dist/native-candidate/npm/*.tgz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frozen-source-evidence-${{ matrix.target }}
          retention-days: 7
          path: |
            dist/frozen/freeze.json
            dist/frozen/public-export-receipt.json

  assembly-check:
    needs: frozen
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: unsigned-native-candidate-*
          path: dist/candidates
      - name: Assemble all five platforms without publication
        run: >-
          python scripts/assemble_npm_release.py
          --candidate dist/candidates/unsigned-native-candidate-darwin-arm64
          --candidate dist/candidates/unsigned-native-candidate-darwin-x64
          --candidate dist/candidates/unsigned-native-candidate-linux-arm64
          --candidate dist/candidates/unsigned-native-candidate-linux-x64
          --candidate dist/candidates/unsigned-native-candidate-win32-x64
          --output dist/npm-assembly-check
      - uses: actions/upload-artifact@v4
        with:
          name: unpublished-0319-assembly-check-not-native-certified
          retention-days: 7
          path: dist/npm-assembly-check
      - name: Pack customer tarballs once without lifecycle scripts
        run: |
          mkdir dist/customer-tarballs
          for package in dist/npm-assembly-check/*/; do
            npm pack "$package" --pack-destination dist/customer-tarballs --offline --ignore-scripts >/dev/null
          done
          cd dist/customer-tarballs
          test "$(find . -name '*.tgz' | wc -l)" -eq 6
          sha256sum *.tgz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: customer-tarballs-unpublished
          retention-days: 7
          path: dist/customer-tarballs

  customer-install:
    needs: assembly-check
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-22.04-arm, macos-15, macos-15-intel, windows-2022]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: customer-tarballs-unpublished
          path: packs
      - name: Install and run the exact platform pair without the registry
        shell: bash
        run: |
          set -eu
          target=$(node -p 'process.platform+"-"+process.arch')
          cd packs
          node -e 'const fs=require("fs"),h=require("crypto"),rows=fs.readFileSync("SHA256SUMS","utf8").trim().split("\n");if(rows.length!==6)process.exit(1);for(const row of rows){const m=/^([0-9a-f]{64})  ([a-z0-9.-]+\.tgz)$/.exec(row);if(!m||h.createHash("sha256").update(fs.readFileSync(m[2])).digest("hex")!==m[1])process.exit(1)}'
          npm install --prefix ../installed --offline --ignore-scripts --no-fund --no-audit --cache ../empty-cache \
            "./openvegas-ai-0.3.19.tgz" "./lordesteph-openvegas-${target}-0.3.19.tgz"
          cd ../installed
          node -e 'const fs=require("fs"),h=require("crypto");const t=process.platform+"-"+process.arch,r=require("./node_modules/openvegas-ai/release.json"),p=r.platforms[t];if(r.version!=="0.3.19"||h.createHash("sha256").update(fs.readFileSync("node_modules/"+p.package+"/bin/"+p.binary)).digest("hex")!==p.sha256)process.exit(1)'
          node node_modules/openvegas-ai/bin/openvegas.js --version | grep '0\.3\.19'
          node node_modules/openvegas-ai/bin/openvegas.js --verify-bundle

name: Exact 0.3.19 native setup plans (QA only, no build)
on:
  push:
    branches: ['codex/native-release-0319']
    paths: ['.github/workflows/native-public.yml']
permissions:
  contents: read
  actions: read

jobs:
  exact-plan:
    name: Installed native plans / ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-22.04, target: linux-x64}
          - {runner: ubuntu-22.04-arm, target: linux-arm64}
          - {runner: macos-15, target: darwin-arm64}
          - {runner: macos-15-intel, target: darwin-x64}
          - {runner: windows-2022, target: win32-x64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 12
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Fetch original immutable customer pack (run 43742060705)
        uses: actions/download-artifact@v4
        with:
          name: customer-tarballs-unpublished
          repository: StephenEkwedike/OpenVegas
          run-id: 43742060705
          github-token: ${{ github.token }}
          path: packs
      - name: Verify and clean-install the exact customer pair without the registry
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p 'process.platform+"-"+process.arch')" = "$TARGET"
          cd packs
          case "$TARGET" in
            darwin-arm64) pin=b56a87f9477e51e3a33aa03e446c851b3b2e1d142ab858a12ba81c9bff8eba9e ;;
            darwin-x64)   pin=c5881ec6562e6bd8d07da5211295bf2ddca715ebc9b1fe3f1b084b8eac7713aa ;;
            linux-arm64)  pin=617e7e7a0d177a0e6b14ea2e14232bd59a720bc90fbe83b32863c7990dc1a630 ;;
            linux-x64)    pin=98af1c7840d451c4bb41b76831e6d0f97ae84a967ed4f2710605e3a3fdcf03c1 ;;
            win32-x64)    pin=3566885a68160769c5d168b0118dfe4b8428fcf241e241cd4e26cb816dcdb729 ;;
            *) exit 1 ;;
          esac
          main=openvegas-ai-0.3.19.tgz
          platform="lordesteph-openvegas-${TARGET}-0.3.19.tgz"
          node -e 'const fs=require("fs"),c=require("crypto"); for(const [name,h] of [[process.argv[1],"fe297a390e2cbd3c2f1a5b9293acd49184b023f34e4f7a2883d26e4004e8cb28"],[process.argv[2],process.argv[3]]]){if(c.createHash("sha256").update(fs.readFileSync(name)).digest("hex")!==h)throw Error("tarball digest"); console.log(name,h)}' "$main" "$platform" "$pin"
          npm install --offline --ignore-scripts --no-fund --no-audit --no-package-lock --cache ../empty-cache --prefix ../installed "./$main" "./$platform"
      - name: Install exact platform executables (never run package scripts)
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix hosts --registry=https://registry.npmjs.org --ignore-scripts --no-audit --no-fund --no-package-lock --save-exact "@openai/codex@0.166.0-${TARGET}" "@anthropic-ai/claude-code-${TARGET}@2.1.322"
      - name: Verify both executable versions and both installed native plans
        shell: python
        run: |
          import hashlib, json, os, pathlib, re, shutil, subprocess, tempfile
          P = pathlib.Path
          target = os.environ['TARGET']
          triple = {'linux-x64':'x86_64-unknown-linux-musl','linux-arm64':'aarch64-unknown-linux-musl',
                    'darwin-arm64':'aarch64-apple-darwin','darwin-x64':'x86_64-apple-darwin','win32-x64':'x86_64-pc-windows-msvc'}[target]
          node = P(shutil.which('node')).resolve(strict=True)
          suffix = '.exe' if os.name == 'nt' else ''
          root = P.cwd()
          m = root/'installed/node_modules'
          customer = m/'openvegas-ai'
          js = customer/'bin/openvegas.js'
          hosts = root/'hosts/node_modules'
          codex = hosts/'@openai/codex'
          claude = hosts/('@anthropic-ai/claude-code-'+target)
          def sha(p):
              with p.open('rb') as f: return hashlib.file_digest(f,'sha256').hexdigest()
          for p,n,v in [(codex,'@openai/codex','0.166.0-'+target),(claude,'@anthropic-ai/claude-code-'+target,'2.1.322')]:
              meta = json.loads((p/'package.json').read_bytes())
              assert (meta['name'],meta['version']) == (n,v)
          exes = {'codex':codex/'vendor'/triple/'bin'/('codex'+suffix), 'claude':claude/('claude'+suffix)}
          index = json.loads((customer/'release.json').read_bytes())
          assert index['source_sha256']=='f85cb9440c8d20ac65df5c2ff4275c80df9df4676672dd76dca6cbab8779bf79' and index['version']=='0.3.19'
          p = index['platforms'][target]
          assert p['package']=='@lordesteph/openvegas-'+target and p['binary']=='openvegas-'+target+suffix
          assert sha(m/p['package']/'bin'/p['binary'])==p['sha256']
          assert sha(js)=='1a8a0bf494acc4ab68c9828bb0f100ba3267ca7bd0386056591b87d33d933555'
          print('Verified original installed binary:',target,p['sha256'],flush=True)
          with tempfile.TemporaryDirectory() as scratch:
              home=P(scratch).resolve(); work=home/'work'; work.mkdir()
              env={k:os.environ[k] for k in ('PATH','SYSTEMROOT','WINDIR','PATHEXT','COMSPEC','SYSTEMDRIVE','PROGRAMDATA','ProgramFiles','ProgramFiles(x86)','ProgramW6432','ALLUSERSPROFILE','CommonProgramFiles','CommonProgramFiles(x86)') if k in os.environ}
              env.update(HOME=str(home),USERPROFILE=str(home),TMP=str(home),TEMP=str(home),TMPDIR=str(home),CI='true',
                         OPENVEGAS_LOAD_PROJECT_ENV='0',OPENVEGAS_BACKEND_URL='http://127.0.0.1:1',
                         DISABLE_TELEMETRY='1',DISABLE_AUTOUPDATER='1',DISABLE_ERROR_REPORTING='1',CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC='1')
              for k,d in [('CODEX_HOME','.codex'),('CLAUDE_CONFIG_DIR','.claude'),('XDG_CONFIG_HOME','config'),('APPDATA','Roaming'),('LOCALAPPDATA','Local')]:
                  v=home/d; v.mkdir(); env[k]=str(v)
              if os.name=='nt':
                  env.update(HOMEDRIVE=home.drive,HOMEPATH=str(home)[len(home.drive):])
                  bash=P(env['ProgramFiles'])/'Git/bin/bash.exe'
                  assert bash.is_file()
                  env['CLAUDE_CODE_GIT_BASH_PATH']=str(bash)
              env['PATH']=os.pathsep.join([*(str(p.parent.resolve(strict=True)) for p in exes.values()),env['PATH']])
              def run(label,argv):
                  q=subprocess.run(argv,env=env,cwd=work,stdin=subprocess.DEVNULL,capture_output=True,encoding='utf-8',errors='replace',timeout=180)
                  if q.returncode:
                      reason=next((x for x in ('plugin command failed','was not found','No host settings were changed','Local integration setup failed') if x in q.stdout+q.stderr),'no fixed diagnostic')
                      raise SystemExit(f'{label}: exit {q.returncode}: {reason}')
                  return q.stdout
              for host,version in [('codex','0.166.0'),('claude','2.1.322')]:
                  exe=exes[host].resolve(strict=True)
                  assert P(shutil.which(host,path=env['PATH'])).samefile(exe)
                  out=run(host+' version',[str(exe),'--version'])
                  assert re.search(r'(?<![\d.])'+re.escape(version)+r'(?![\d.])',out)
                  print(host,version,'verified native executable',sha(exe),flush=True)
              rows=run('installed native plans',[str(node),str(js),'--local','go','--host','both','--dry-run']).splitlines()
              for row in ('codex 0.166.0: mcp_text_only','claude 2.1.322: mod_and_mcp'):
                  assert rows.count(row)==1, 'Missing expected native plan: '+row
                  print('Verified installed plan:',row,flush=True)
